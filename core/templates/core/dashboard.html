<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeighbourShield Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100">
    <div class="fixed left-0 top-0 h-full z-40">
        <button id="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="false" class="fixed left-0 top-1/2 z-50 -translate-y-1/2 w-10 h-14 ml-0 rounded-r-md bg-blue-700 text-white flex items-center justify-center hover:bg-blue-600 focus:outline-none ring-2 ring-white/20 transition-transform duration-200">
            <svg id="sidebar-toggle-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform transition-transform duration-200 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </button>
        <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-slate-900 text-slate-100 transform -translate-x-[15rem] transition-transform duration-200 z-40">
            <div class="border-b border-slate-700 px-5 py-6 text-xl font-bold">NeighbourShield</div>
            <nav class="p-3 space-y-2">
                <a href="{% url 'dashboard' %}" class="block rounded bg-blue-700 px-4 py-3 font-semibold text-white">Dashboard</a>
                <a href="{% url 'township-management' %}" class="block rounded px-4 py-3 hover:bg-slate-800">Township setup</a>
                <a href="{% url 'volunteer_applications' %}" class="block rounded px-4 py-3 hover:bg-slate-800">Volunteer Apps</a>
                <a href="{% url 'emergency-broadcast' %}" class="block rounded px-4 py-3 hover:bg-slate-800">Broadcast Alerts</a>
                <a href="/admin/" class="block rounded px-4 py-3 hover:bg-slate-800">Django admin</a>
            </nav>
        </aside>
    </div>

    <!-- WRAPPER FOR MAIN CONTENT -->
    <div id="page-content" class="transition-all duration-200 ml-0">
        <nav class="bg-blue-800 p-4 text-white shadow-md">
            <div class="container mx-auto flex items-center justify-between">
                <h1 class="text-xl font-bold">NeighbourShield Admin Dashboard</h1>
                <span>Logged in as: {{ request.user.username }}</span>
            </div>
        </nav>

        <div class="container mx-auto mt-8 grid grid-cols-1 gap-6 p-4">

            <!-- Left Side: The Map -->
            <div class="bg-white rounded-lg shadow p-4">
                <h2 class="text-xl font-semibold mb-4">Live Incident Map</h2>
                <!-- Map Container (must have a defined height) -->
                <div id="map" class="w-full h-[500px] rounded border"></div>
            </div>

            <!-- Right Side: The Table -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <h2 class="text-xl font-semibold p-4 bg-gray-50 border-b">Active SOS Incidents</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white">
                        <thead class="bg-gray-800 text-white">
                            <tr>
                                <th class="py-3 px-4 text-left">Resident</th>
                                <th class="py-3 px-4 text-left">Status</th>
                                <th class="py-3 px-4 text-left">Time</th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-700">
                            <!-- This will be populated by JavaScript -->
                            <tr>
                                <td colspan="3" class="py-4 text-center text-gray-500">Loading active incidents...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div> <!-- END WRAPPER -->

    <script>
        (function(){
            const toggle = document.getElementById('sidebar-toggle');
            const sidebar = document.getElementById('sidebar');
            const icon = document.getElementById('sidebar-toggle-icon');
            const pageContent = document.getElementById('page-content');

            if (!toggle || !sidebar) return;
            toggle.addEventListener('click', function(e){
                const isOpen = toggle.getAttribute('aria-expanded') === 'true';
                if (isOpen) {
                    sidebar.classList.add('-translate-x-[15rem]');
                    sidebar.classList.remove('translate-x-0');
                    toggle.classList.remove('translate-x-[15rem]');
                    icon.classList.remove('rotate-180');
                    toggle.setAttribute('aria-expanded','false');

                    // Remove margin to expand content
                    if(pageContent) pageContent.classList.remove('ml-60');
                } else {
                    sidebar.classList.remove('-translate-x-[15rem]');
                    sidebar.classList.add('translate-x-0');
                    toggle.classList.add('translate-x-[15rem]');
                    icon.classList.add('rotate-180');
                    toggle.setAttribute('aria-expanded','true');

                    // Add margin to shrink content and avoid overlap
                    if(pageContent) pageContent.classList.add('ml-60');
                }

                // Tell Leaflet to resize the map after the transition ends
                setTimeout(() => {
                    if (typeof map !== 'undefined') {
                        map.invalidateSize();
                    }
                }, 200);
            });
        })();
    </script>

    <!-- Map Initialization Script with Auto-Refresh -->
    <script>
        // 1. Get the initial static JSON data passed from Django
        const propertyMarkersData = JSON.parse('{{ property_markers_json|escapejs }}');
        const areaBoundariesData = JSON.parse('{{ area_boundaries_json|escapejs }}');

        // 2. Initialize the map
        let mapCenter = [3.1390, 101.6869];
        let zoomLevel = 10;
        const map = L.map('map').setView(mapCenter, zoomLevel);
        const mapBounds = [];

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_4n83_1_f56c163dd4fc94a222f8a7e0', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors, © CARTO'
        }).addTo(map);

        // Create a dedicated layer for incidents so we can clear and redraw them easily
        const incidentLayer = L.layerGroup().addTo(map);

        // 3. Draw static elements (Properties and Areas)
        propertyMarkersData.forEach(function(propertyInfo) {
            const propertyIcon = L.divIcon({
                className: '',
                html: '<div style="background:#2563eb;color:#fff;border:2px solid #fff;border-radius:50% 50% 50% 0;box-shadow:0 1px 4px #555;transform:rotate(-45deg);width:24px;height:24px;line-height:24px;text-align:center"><span style="display:inline-block;transform:rotate(45deg)">⌂</span></div>',
                iconSize: [24, 24], iconAnchor: [12, 24], popupAnchor: [0, -24]
            });
            const marker = L.marker([propertyInfo.lat, propertyInfo.lng], {icon: propertyIcon}).addTo(map);
            marker.bindPopup(`<strong>Property:</strong> ${propertyInfo.unit_number}<br><strong>Address:</strong> ${propertyInfo.address}<br><strong>Area:</strong> ${propertyInfo.area}<br><strong>Residents:</strong> ${propertyInfo.resident_count}`);
            mapBounds.push([propertyInfo.lat, propertyInfo.lng]);
        });

        areaBoundariesData.forEach(function(areaInfo) {
            const center = [areaInfo.lat, areaInfo.lng];
            const boundary = L.circle(center, {
                radius: areaInfo.radius_m, color: '#7c3aed', fillColor: '#a78bfa', fillOpacity: 0.08, weight: 2, dashArray: '6, 8'
            }).addTo(map);
            L.circleMarker(center, {color: '#7c3aed', fillColor: '#7c3aed', fillOpacity: 1, radius: 4}).addTo(map)
                .bindPopup(`<strong>${areaInfo.name}</strong><br>Area centre · ${areaInfo.radius_m} m radius`);
            boundary.bindTooltip(areaInfo.name, {sticky: true});
            mapBounds.push(boundary.getBounds());
        });

        if (mapBounds.length > 0) {
            map.fitBounds(mapBounds, {padding: [24, 24], maxZoom: 15});
        }

        // 4. Fetch and update active incidents (Polling)
        async function fetchActiveIncidents() {
            try {
                // Fetch from your DRF API endpoint
                const response = await fetch('/api/incidents/');
                if (!response.ok) return;
                const incidents = await response.json();

                // Filter out resolved or cancelled incidents
                const activeIncidents = incidents.filter(inc => inc.status !== 'resolved' && inc.status !== 'cancelled');

                // Update Map
                incidentLayer.clearLayers();
                activeIncidents.forEach(inc => {
                    // Check if it's escalated or pending
                    let circleColor = (inc.status === 'pending' || inc.status === 'escalated') ? 'red' : 'orange';
                    let marker = L.circleMarker([inc.latitude, inc.longitude], {
                        color: circleColor, fillColor: circleColor, fillOpacity: 0.8, radius: 8
                    });

                    let timeStr = new Date(inc.created_at).toLocaleString('en-GB', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                    marker.bindPopup(`<strong>Resident:</strong> ${inc.user.username}<br><strong>Status:</strong> ${inc.status.toUpperCase()}<br><strong>Time:</strong> ${timeStr}`);
                    incidentLayer.addLayer(marker);
                });

                // Update Table
                const tbody = document.querySelector('table tbody');
                tbody.innerHTML = '';

                if (activeIncidents.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-gray-500">No active incidents.</td></tr>`;
                    return;
                }

                activeIncidents.forEach(inc => {
                    let statusClass = (inc.status === 'pending' || inc.status === 'escalated') ? 'bg-red-200 text-red-800' :
                                      inc.status === 'acknowledged' ? 'bg-yellow-200 text-yellow-800' :
                                      'bg-green-200 text-green-800';

                    let timeStr = new Date(inc.created_at).toLocaleString('en-GB', { month: 'short', day: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    let statusFormatted = inc.status.charAt(0).toUpperCase() + inc.status.slice(1);

                    let tr = document.createElement('tr');
                    tr.className = 'border-b';
                    tr.innerHTML = `
                        <td class="py-3 px-4">${inc.user.username}</td>
                        <td class="py-3 px-4"><span class="px-2 py-1 rounded text-sm ${statusClass}">${statusFormatted}</span></td>
                        <td class="py-3 px-4">${timeStr}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error('Error fetching live incidents:', error);
            }
        }

        // Run immediately on load, then repeat every 10 seconds
        fetchActiveIncidents();
        setInterval(fetchActiveIncidents, 10000);
    </script>
</body>
</html>
